<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Scam Analyzer - ScamShield</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .analyzer-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .analyzer-card {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #555;
            font-size: 15px;
        }

        .title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 15px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #777;
        }

        .analyze-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #analysis-result {
            display: none;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="analyzer-page">

        <div class="analyzer-card">

            <a href="/" class="back-link">
                ← Back to ScamShield
            </a>

            <h1 class="title">
                🤖 AI Scam Analyzer
            </h1>

            <p class="description">
                Paste a suspicious message below and analyze it for possible scam indicators.
            </p>

            <textarea id="scam-message"
                placeholder="Paste suspicious SMS, WhatsApp message, email, or other message here..."></textarea>

            <button class="analyze-btn" onclick="analyzeScam()">
                🔍 Analyze Message
            </button>

            <div id="analysis-result"></div>

        </div>

    </div>
    <script>
        async function analyzeScam() {

            const message =
                document.getElementById("scam-message").value.trim();

            if (!message) {
                alert("Please paste a suspicious message first.");
                return;
            }

            try {

                const reportId =
                    localStorage.getItem("report_id");

                const response =
                    await fetch("/api/analyze", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: message,
                            report_id: reportId
                        })
                    });

                const data =
                    await response.json();

                if (!response.ok) {
                    alert(data.error || "Analysis failed.");
                    return;
                }

                displayAnalysisResult(data);

            } catch (error) {

                console.error(error);

                alert("Cannot connect to the backend.");
            }
        }
        function displayAnalysisResult(data) {

            const resultBox =
                document.getElementById("analysis-result");

            let riskColor = "#2e7d32";
            let riskBackground = "#e8f5e9";

            if (data.risk_level === "HIGH") {
                riskColor = "#d32f2f";
                riskBackground = "#ffebee";
            } else if (data.risk_level === "MEDIUM") {
                riskColor = "#f57c00";
                riskBackground = "#fff3e0";
            }

            resultBox.style.display = "block";

            resultBox.innerHTML = `
        <div style="
            margin-top: 30px;
            padding: 30px;
            border-radius: 20px;
            background: white;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        ">

            <h2 style="
                margin-top: 0;
                margin-bottom: 25px;
            ">
                🔍 Scam Analysis Result
            </h2>

            <div style="
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border-radius: 30px;
    background: ${riskBackground};
    color: ${riskColor};
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 25px;
">
    <span style="font-size: 20px;">🚨</span>
    ${data.risk_level} RISK
</div>

            <div style="margin-bottom: 20px;">

                <h3>📊 Scam Risk Score</h3>

                <p style="
                    font-size: 28px;
                    font-weight: bold;
                    color: ${riskColor};
                ">
                    ${data.scam_probability}%
                </p>

            </div>

            <div style="margin-bottom: 20px;">

                <h3>🏷️ Scam Type</h3>

                <p>
                    ${data.scam_type}
                </p>

            </div>

            <div style="margin-bottom: 20px;">

                <h3>⚠️ Warning Signs</h3>

                <ul>
                    ${data.warning_signs.length > 0
                    ? data.warning_signs
                        .map(sign => `<li>${sign}</li>`)
                        .join("")
                    : "<li>No major warning signs detected.</li>"
                }
                </ul>

            </div>

            <div style="
                padding: 18px;
                border-radius: 14px;
                background: #f5f7fb;
            ">

                <h3>🛡️ Recommended Action</h3>

                <p style="line-height: 1.6;">
                    ${data.recommended_action}
                </p>

            </div>

        </div>
    `;
        }
    </script>
</body>

</html>
