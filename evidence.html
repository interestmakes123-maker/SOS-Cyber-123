<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evidence Vault - ScamShield</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .page {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }

        .back {
            text-decoration: none;
            color: #555;
        }

        h1 {
            text-align: center;
            margin-top: 25px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .upload-box {
            margin-top: 20px;
            padding: 25px;
            border: 2px dashed #bbb;
            border-radius: 15px;
            text-align: center;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="container">

            <a href="/" class="back">← Back to ScamShield</a>

            <h1>🗂️ Evidence Vault</h1>

            <p class="subtitle">
                Securely record and upload evidence related to your scam
            </p>

            <div id="dynamic-fields">

                <!-- Fields will change based on scam type -->

            </div>

            <label>Incident Details</label>
            <textarea id="incident_details" placeholder="Describe what happened..."></textarea>

            <label>Upload Evidence</label>

            <div class="upload-box">
                <input type="file" id="file" accept=".png,.jpg,.jpeg,.pdf,.txt,.doc,.docx">
            </div>

            <button onclick="uploadEvidence()">
                📤 Upload Evidence
            </button>

            <div id="message"></div>

        </div>

    </div>

    <script>

        const reportId =
            new URLSearchParams(window.location.search).get("report_id");

        const scamType =
            localStorage.getItem("selected_scam_type");


        function loadEvidenceFields() {

            const container =
                document.getElementById("dynamic-fields");

            if (!container) return;

            let fields = "";


            if (scamType === "Job Scam") {

                fields = `
            <label>Recruiter Phone / Email</label>
            <input
                type="text"
                id="scammer_phone"
                placeholder="Enter recruiter phone or email"
            >

            <label>Company Name</label>
            <input
                type="text"
                id="company_name"
                placeholder="Enter company name"
            >

            <label>Registration / Payment Amount</label>
            <input
                type="number"
                id="amount_lost"
                placeholder="Enter amount paid"
            >
        `;

            }


            else if (scamType === "Online Shopping Scam") {

                fields = `
            <label>Shopping Website / URL</label>
            <input
                type="text"
                id="scammer_phone"
                placeholder="Enter suspicious website or URL"
            >

            <label>Order ID</label>
            <input
                type="text"
                id="transaction_id"
                placeholder="Enter order ID"
            >

            <label>Amount Lost</label>
            <input
                type="number"
                id="amount_lost"
                placeholder="Enter amount lost"
            >
        `;

            }


            else if (scamType === "Money Transfer Scam") {

                fields = `
            <label>Scammer Phone Number</label>
            <input
                type="text"
                id="scammer_phone"
                placeholder="Enter scammer phone number"
            >

            <label>Transaction ID</label>
            <input
                type="text"
                id="transaction_id"
                placeholder="Enter transaction ID"
            >

            <label>Amount Lost</label>
            <input
                type="number"
                id="amount_lost"
                placeholder="Enter amount lost"
            >
        `;

            }


            else if (scamType === "OTP Scam") {

                fields = `
            <label>Scammer Phone Number</label>
            <input
                type="text"
                id="scammer_phone"
                placeholder="Enter scammer phone number"
            >

            <label>Bank / Service Name</label>
            <input
                type="text"
                id="transaction_id"
                placeholder="Enter bank or service name"
            >

            <label>Amount Lost</label>
            <input
                type="number"
                id="amount_lost"
                placeholder="Enter amount lost"
            >
        `;

            }


            else if (scamType === "Phishing Scam") {

                fields = `
            <label>Suspicious URL</label>
            <input
                type="text"
                id="scammer_phone"
                placeholder="Enter suspicious URL"
            >

            <label>Email / Phone Number</label>
            <input
                type="text"
                id="transaction_id"
                placeholder="Enter sender email or phone"
            >
        `;

            }


            else if (scamType === "Fake Call Scam") {

                fields = `
            <label>Caller Phone Number</label>
            <input
                type="text"
                id="scammer_phone"
                placeholder="Enter caller phone number"
            >

            <label>Organization Claimed</label>
            <input
                type="text"
                id="transaction_id"
                placeholder="Example: Bank, Police, Courier"
            >

            <label>Amount Lost</label>
            <input
                type="number"
                id="amount_lost"
                placeholder="Enter amount lost"
            >
        `;

            }


            else {

                fields = `
            <label>Scammer Phone Number</label>
            <input
                type="text"
                id="scammer_phone"
                placeholder="Enter scammer phone number"
            >

            <label>Transaction ID</label>
            <input
                type="text"
                id="transaction_id"
                placeholder="Enter transaction ID"
            >

            <label>Amount Lost</label>
            <input
                type="number"
                id="amount_lost"
                placeholder="Enter amount lost"
            >
        `;

            }


            container.innerHTML = fields;
        }


        loadEvidenceFields();


        async function uploadEvidence() {

            const currentReportId =
                new URLSearchParams(window.location.search)
                    .get("report_id");

            const file =
                document.getElementById("file").files[0];


            if (!currentReportId) {

                alert("Report ID is missing.");
                return;

            }


            if (!file) {

                alert("Please select an evidence file.");
                return;

            }


            const formData = new FormData();

            formData.append(
                "report_id",
                currentReportId
            );


            const phone =
                document.getElementById("scammer_phone");

            const transaction =
                document.getElementById("transaction_id");

            const amount =
                document.getElementById("amount_lost");


            formData.append(
                "scammer_phone",
                phone ? phone.value : ""
            );


            formData.append(
                "transaction_id",
                transaction ? transaction.value : ""
            );


            formData.append(
                "amount_lost",
                amount ? amount.value : ""
            );


            formData.append(
                "incident_details",
                document.getElementById("incident_details").value
            );


            formData.append(
                "file",
                file
            );


            try {

                const response =
                    await fetch(
                        "/api/evidence",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    document.getElementById("message").innerText =
                        data.error || "Upload failed.";

                    return;

                }


                document.getElementById("message").innerText =
                    "✅ Evidence uploaded successfully!";


                setTimeout(() => {

                    window.location.href =
                        "/timeline?report_id=" +
                        currentReportId;

                }, 1000);


            } catch (error) {

                console.error(error);

                document.getElementById("message").innerText =
                    "Unable to upload evidence.";

            }

        }

    </script>
</body>

</html>
